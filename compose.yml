    profiles: ["app"]
    command: ["java", "-jar", "/app/api-gateway.jar"]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app/api-gateway.jar:ro
    depends_on:
      config-server:
