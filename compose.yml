services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: dueno_db
      MYSQL_USER: ${DB_USERNAME:-patitas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - dueno-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  config-server:
    image: eclipse-temurin:25-jre-alpine
    profiles: ["app"]
    command: ["java", "-jar", "/app/config-server.jar"]
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/ggomarighetti/patitas-config.git}
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./config-server/target/config-server-0.0.1-SNAPSHOT.jar:/app/config-server.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s

  eureka-server:
    image: eclipse-temurin:25-jre-alpine
    profiles: ["app"]
    command: ["java", "-jar", "/app/eureka-server.jar"]
    ports:
      - "127.0.0.1:8761:8761"
    volumes:
      - ./eureka-server/target/eureka-server-0.0.1-SNAPSHOT.jar:/app/eureka-server.jar:ro
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s

  ms-dueno:
    image: eclipse-temurin:25-jre-alpine
    profiles: ["app"]
    command: ["java", "-jar", "/app/ms-dueno.jar"]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_URL: jdbc:mysql://mysql:3306/dueno_db
      DB_USERNAME: ${DB_USERNAME:-patitas}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    expose:
      - "8081"
    volumes:
      - ./ms-dueno/target/ms-dueno-0.0.1-SNAPSHOT.jar:/app/ms-dueno.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s


  mysql-mascota:
    image: mysql:8.0.40
    profiles: ["app"]
    environment:
      MYSQL_DATABASE: mascota_db
      MYSQL_USER: ${DB_USERNAME:-patitas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mascota-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 36

  ms-mascota:
